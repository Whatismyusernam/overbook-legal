<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오버북 : 책을 기록하다 — 약관 안내</title>
<meta name="description" content="오버북(책을 기록하다) 미니앱의 서비스 이용약관과 개인정보 처리방침">
<style>
  :root{
    --navy:#1E4D8C;
    --ink:#191F28;
    --sub:#4E5968;
    --line:#E5E8EB;
    --soft:#F7F8FA;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;background:#fff;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",
      "Malgun Gothic","Noto Sans KR",sans-serif;
    font-size:16px;line-height:1.7;word-break:keep-all;
  }
  .wrap{max-width:720px;margin:0 auto;padding:56px 20px 72px;}
  .eyebrow{
    display:inline-block;font-size:13px;font-weight:700;color:var(--navy);margin:0 0 10px;
  }
  h1{font-size:28px;font-weight:800;margin:0 0 12px;letter-spacing:-.01em;}
  .lead{color:var(--sub);margin:0 0 32px;}
  .card{
    display:block;text-decoration:none;color:inherit;
    border:1px solid var(--line);border-radius:14px;
    padding:20px 22px;margin:0 0 12px;
    transition:border-color .15s ease, background .15s ease;
  }
  .card:hover{border-color:var(--navy);background:var(--soft);}
  .card strong{display:block;font-size:17px;font-weight:700;margin:0 0 4px;color:var(--navy);}
  .card span{font-size:14px;color:var(--sub);}
  footer{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);font-size:14px;color:var(--sub);}
</style>
</head>
<body>
<div class="wrap">
  <span class="eyebrow">오버북 : 책을 기록하다</span>
  <h1>약관 안내</h1>
  <p class="lead">토스 앱 미니앱 &lsquo;오버북 : 책을 기록하다&rsquo;의 이용약관과 개인정보 처리방침입니다.</p>

  <a class="card" href="./terms.html">
    <strong>서비스 이용약관</strong>
    <span>서비스 이용 조건, 이용자의 의무, 기록물의 권리 등</span>
  </a>

  <a class="card" href="./privacy.html">
    <strong>개인정보 처리방침</strong>

  </a>

  <footer>
    <p>오버북 &middot; 시행일 2026년 8월 19일</p>
  </footer>
</div>
</body>
</html>
